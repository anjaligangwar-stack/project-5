<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
   <div class="container">
    <h1>Temperature Converter</h1>

    <div class="input-box"><input type="number" id="temperature" placeholder="enter Temperature">
    
    <select name="" id="scale">
      
        <option value="celsius">celsius(C)</option>
        <option value="fahrenheit">Fahrenheit(F)</option>
        <option value="kelvin">Kalvin(K)</option>

    </select>
    </div>
    <div class="buttons">
        <button onclick="convertTemperature()">Convert</button>
        <button class="reset" onclick="resetConverter()">Reset</button>
    </div>
    <div class="result">
        <div class="card">
            <h2>Celsius</h2>
            <p id="celsius">0 c</p>
        </div>
        <div class="card">
            <h2>Fahrenheit</h2>
            <p id="fahrenheit">32 F</p>
        </div>
        <div class="card">
            <h2>kalvin</h2>
            <p id="kelvin">273.15 k</p>
        </div>
    </div>
</div> 
<script src="index.js"></script>
</body>
</html>
